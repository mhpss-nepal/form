<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service contacts & referrals — interactive preview</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<style>body{margin:0;font:16px/1.5 system-ui;color:#183039}header{padding:12px 16px;background:#eef3f1}h1{font-size:20px;margin:4px 0}nav{display:flex;gap:16px;flex-wrap:wrap}button{font:inherit;min-height:44px;margin:4px;padding:6px 12px}button[aria-selected=true]{background:#183039;color:white}iframe{display:block;border:0;width:100%;height:76vh}iframe[hidden]{display:none}p{margin:6px 0}a{color:inherit}:focus-visible{outline:3px solid #d19e14}</style></head><body>
<header><nav class="workflow-nav"><a href="../index.html">← All Forms</a><a href="../../hub/">Hub / Back to Home</a><a href="../5ws-report.html">5Ws</a></nav>
<h1 id="workflow-title">Service contacts & referrals</h1><p id="workflow-notice">Interactive preview — not saved or sent. Do not enter real personal information.</p>
<p id="workflow-help">Record a contact and any referral together. Later, use referral outcome. These are separate events; this preview does not join records or copy identity.</p>
<div role="tablist" aria-label="Service contact workflow"><button type="button" id="contact-tab" role="tab" aria-controls="contact-frame" aria-selected="true">Contact + referral</button><button type="button" id="followup-tab" role="tab" aria-controls="followup-frame" aria-selected="false">Later referral outcome</button></div></header>
<iframe id="contact-frame" title="Contact and referral preview" sandbox="allow-scripts allow-same-origin allow-top-navigation"></iframe>
<iframe id="followup-frame" title="Later referral outcome preview" hidden sandbox="allow-scripts allow-same-origin allow-top-navigation"></iframe>
<script>
(function(){var lang=new URLSearchParams(location.search).get('lang')==='ne'?'ne':'en';document.documentElement.lang=lang;
if(lang==='ne'){document.getElementById('workflow-title').textContent='सेवा सम्पर्क तथा रेफरल';document.getElementById('workflow-notice').textContent='अन्तरक्रियात्मक पूर्वावलोकन — सुरक्षित वा पठाइँदैन। वास्तविक व्यक्तिगत जानकारी नलेख्नुहोस्।';document.getElementById('workflow-help').textContent='सम्पर्क र रेफरल सँगै भर्नुहोस्। पछि रेफरल नतिजा हेर्नुहोस्। यी अलग घटना हुन्; यो पूर्वावलोकनले अभिलेख वा पहिचान जोड्दैन।';document.getElementById('contact-tab').textContent='सम्पर्क + रेफरल';document.getElementById('followup-tab').textContent='पछिको रेफरल नतिजा';}
document.getElementById('contact-frame').src='contact-instrument.html?lang='+lang;document.getElementById('followup-frame').src='referral-outcome.html?lang='+lang;
['contact','followup'].forEach(function(key){document.getElementById(key+'-tab').addEventListener('click',function(){['contact','followup'].forEach(function(k){document.getElementById(k+'-frame').hidden=k!==key;document.getElementById(k+'-tab').setAttribute('aria-selected',String(k===key));});});});})();
</script></body></html>
