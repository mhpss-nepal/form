<script>
function flash(btn, text){
  var old = btn.textContent; btn.textContent = text;
  setTimeout(function(){ btn.textContent = old; }, 1600);
}
function COPY(btn){
  /* The button carries a RELATIVE path and it is resolved here, against the
     page's own address. So the link a field worker receives over WhatsApp is
     correct on whatever address this site is on -- github.io today, a real
     domain later -- and does not die every time the address changes.
     (Sadar Hati learned this one the hard way and wrote it down; the QR codes
     cannot be relative in the same way, because a phone camera has no base
     address to resolve against -- those are regenerated by tools/qr-build.py
     and checked on every deploy by tools/qr-check.py.) */
  var rel = btn.getAttribute('data-url');
  var url;
  try { url = new URL(rel, window.location.href).href; }
  catch (e) { url = rel; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function(){ flash(btn, '✓ Copied'); },
                                           function(){ flash(btn, url); });
  } else { flash(btn, url); }
}
function svgFor(key){
  var d = window.QR && window.QR[key];
  if (!d) return '<p class="xs">QR not available for this form.</p>';
  var rows = d.m.split(','), n = d.n, q = 2, size = n + 2*q, r = '';
  for (var y = 0; y < n; y++) {
    var row = rows[y], x = 0;
    while (x < n) {
      if (row[x] === '1') {
        var run = 1;
        while (x + run < n && row[x + run] === '1') run++;
        r += '<rect x="' + (x + q) + '" y="' + (y + q) + '" width="' + run + '" height="1"/>';
        x += run;
      } else x++;
    }
  }
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges" role="img" '
       + 'aria-label="QR code for ' + d.url + '">'
       + '<rect width="' + size + '" height="' + size + '" fill="#fff"/>'
       + '<g fill="#20313b">' + r + '</g></svg>'
       + '<div class="u">' + d.url + '</div>'
       + '<p class="xs">Print this page, or screenshot the code, and put it where people can reach it.</p>';
}
function QRT(btn){
  var box = btn.closest('.ml-card').querySelector('.qrbox');
  if (!box.hidden) { box.hidden = true; return; }
  if (!box.innerHTML) box.innerHTML = svgFor(btn.getAttribute('data-qr'));
  box.hidden = false;
}
document.getElementById('copyAll').addEventListener('click', function(){ COPY(this); });
document.getElementById('qrAll').addEventListener('click', function(){
  var box = document.getElementById('qrAllBox');
  if (!box.hidden) { box.hidden = true; return; }
  if (!box.innerHTML) box.innerHTML = svgFor('master');
  box.hidden = false;
});
</script>
