  "validation_contract": [
    {
      "rule": "required",
      "fields": [
        "org",
        "site",
        "dateAD",
        "activity",
        "modality",
        "focalName",
        "focalPhone"
      ]
    },
    {
      "rule": "conditional Other text",
      "conditions": [
        "org=OTHER → orgOther",
        "site=OTHER → siteOther",
        "cadre=OTH/OTHER → cadreOther",
        "modality=OTH/OTHER → modalityOther",
        "district=OTH/OTHER → districtOther",
        "activity.other → activityOther",
        "targetGroups includes TG-OTH → targetGroupOther"
      ]
    },
    {
      "rule": "activity current",
      "detail": "activity must resolve in C.activityByCode and not be retired"
    },
    {
      "rule": "session time format",
      "detail": "if present, HH:MM 24-hour"
    },
    {
      "rule": "free-text privacy",
      "fields": [
        "cadreOther",
        "modalityOther",
        "districtOther",
        "activityOther",
        "targetGroupOther",
        "orgOther",
        "siteOther"
      ],
      "detail": "reject 7+ consecutive digits or @"
    },
    {
      "rule": "palika",
      "detail": "site=PALIKA requires palika; any palika must match ^NP\\d{7}$"
    },
    {
      "rule": "partners privacy",
      "detail": "organisation names only; reject 7+ consecutive digits or @"
    },
    {
      "rule": "date",
      "detail": "dateAD cannot be later than STORE.todayLocal()"
    },
    {
      "rule": "target group",
      "detail": "at least one target group required"
    },
    {
      "rule": "attendance",
      "detail": "reachedTotal required; enter 0 if nobody attended"
    },
    {
      "rule": "count basis",
      "detail": "countBasis required and form fixes it to CONTACTS; distinctPeople is fixed to empty string on this form"
    },
    {
      "rule": "disaggregation",
      "detail": "sum may not exceed attendance; if nonzero it must equal attendance; partial undercount is rejected"
    },
    {
      "rule": "of-whom bounds",
      "fields": [
        "ofChildAlone",
        "ofPreg",
        "ofPwd",
        "ofInjured",
        "ofDistress"
      ],
      "detail": "each optional value may not exceed attendance; values are not added together"
    }
