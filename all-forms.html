<script>
/* Each card opens its form through the review frame, so the review surface has
   one shape. The href is built here, relative to this page's own address, so it
   keeps working on whatever address the site is served from -- the same reason
   index.html resolves its copy-links at click time rather than baking them in.

   The data-form attribute above is the only place a form's name appears, so
   adding or removing a form here cannot leave a stale address behind. */
(function () {
  var cards = document.querySelectorAll('[data-form]');
  for (var i = 0; i < cards.length; i++) {
    var name = cards[i].getAttribute('data-form');
    cards[i].setAttribute('href', 'preview.html?preview_form=' + name);
  }
})();
</script>
